name: Release on version bump

# Runs only after BOTH "Test" and "Validate" have completed on a push to main.
# A single workflow_run fires per completing workflow, so the gate below re-checks
# that the respective OTHER workflow also succeeded for the exact same commit
# before cutting a release — this guarantees "release AFTER green validation",
# never in parallel with still-running checks.
on:
  workflow_run:
    workflows: ["Test", "Validate"]
    types: [completed]

permissions:
  contents: write
  actions: read

# Test and Validate finishing both fire this workflow for the same commit.
# Serialize those runs per commit so the second one sees the tag already exists
# and skips cleanly, instead of racing a duplicate "gh release create".
concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    # Only for the push that landed on main, and only if the triggering run was green.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Gate — version bump AND both checks green for this commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ok=true

          # 1. This commit must actually change the manifest (the version bump).
          #    Replaces the old `paths:` filter; the API diff handles squash merges.
          if gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '.files[].filename' \
             | grep -qx 'custom_components/template_aliases/manifest.json'; then
            echo "manifest.json changed in $SHA"
          else
            echo "manifest.json not changed in $SHA -> no release"
            ok=false
          fi

          # 2. Both Test and Validate must be green for this exact commit.
          for wf in test.yml validate.yml; do
            concl=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" \
              --commit "$SHA" --event push --limit 1 \
              --json conclusion -q '.[0].conclusion')
            echo "$wf -> ${concl:-<none>}"
            [ "$concl" = "success" ] || ok=false
          done

          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Read version from manifest
        if: steps.gate.outputs.ok == 'true'
        id: version
        run: echo "version=$(jq -r .version custom_components/template_aliases/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Create release if tag does not exist
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG already released, nothing to do"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
              --target "$SHA" --generate-notes
          fi
