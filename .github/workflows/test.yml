name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Weekly early-warning run. requirements_test.txt pins a lower floor but
  # no upper cap, so this installs the latest pytest-homeassistant-custom-component
  # (which tracks the latest HA release). A breaking change in the private
  # core template API therefore turns this run red even when the repo is idle.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: pytest tests/ -v
